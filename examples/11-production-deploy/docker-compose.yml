services:
  glyph:
    build: .
    environment:
      GLYPH_PUBLIC_KEY: ${GLYPH_PUBLIC_KEY}
      GLYPH_PRIVATE_KEY: ${GLYPH_PRIVATE_KEY}
      GLYPH_AUTH_TOKEN: ${GLYPH_AUTH_TOKEN}
      GLYPH_SERVER_ID: ${GLYPH_SERVER_ID:-glyph.production}
      GLYPH_AUDIT_LOG: /app/audit/receipts.jsonl
    volumes:
      - ./audit:/app/audit
    restart: unless-stopped
  edge:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - glyph
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
