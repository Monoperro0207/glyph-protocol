[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glyph-protocol"
version = "1.1.0"
description = "Glyph Protocol — Python SDK (verify + client)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Patrick Espino" }]
requires-python = ">=3.10"
keywords = ["glyph", "glyph-protocol", "ed25519", "llm", "agents"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "cryptography>=42",
  "httpx>=0.27",
  "rfc8785>=0.1.4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/Monoperro0207/glyph-protocol"
Source = "https://github.com/Monoperro0207/glyph-protocol"

[tool.setuptools.packages.find]
where = ["."]
include = ["glyph_protocol*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
