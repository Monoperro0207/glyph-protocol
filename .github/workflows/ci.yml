name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python SDK
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
      - name: Run Python tests
        working-directory: sdks/python
        run: python -m pytest -q

  go-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
      - name: Run Go tests
        working-directory: sdks/go/glyphprotocol
        run: go test ./...

  conformance-badge:
    # Regenerate the README's conformance badge on every push to main.
    # The script always writes docs/conformance-badge.json; we commit it
    # only when it actually changed, so the job is a no-op on most runs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm conformance:badge
      - name: Commit badge if it changed
        run: |
          if ! git diff --quiet docs/conformance-badge.json; then
            git config user.name 'glyph-bot'
            git config user.email 'glyph-bot@users.noreply.github.com'
            git add docs/conformance-badge.json
            git commit -m "chore(badge): refresh conformance-badge.json"
            git push
          else
            echo "badge unchanged, nothing to commit"
          fi
