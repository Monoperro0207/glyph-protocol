# Release workflow — versions and publishes the @glyph-protocol/* packages.
#
# After CI succeeds on main, the Changesets action either:
#   - opens/updates a "Version Packages" PR when changesets are pending, or
#   - publishes to npm when that PR is merged (no changesets pending).
#
# Prerequisites (one-time, done by the maintainer):
#   1. The @glyph-protocol org exists on npm and you are an owner.
#   2. The first publish of each package is done manually (`pnpm -r publish`)
#      — npm trusted publishing can only be configured for packages that
#      already exist.
#   3. On npmjs.com, each package: Settings -> Trusted Publisher -> GitHub
#      Actions, pointing at this repo and `.github/workflows/release.yml`.
# After that, this workflow publishes every subsequent release with no
# npm token stored in GitHub — auth is short-lived OIDC.
#
# After the release, two attestation jobs run:
#   1. `attestations-core` (required post-publish status): generates SBOM +
#      cosign for core packages (@glyphp/core, @glyphp/server,
#      @glyphp/client, @glyphp/conformance). If any core attestation step
#      fails, the workflow fails after publish so the release is visibly
#      marked incomplete.
#   2. `attestations-rest` (best-effort): same for all other packages.
#      `continue-on-error: true` — never blocks the workflow.

name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency: release-${{ github.event.workflow_run.head_branch }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      published_packages: ${{ steps.changesets.outputs.publishedPackages }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # npm >=11.5 is required for OIDC trusted publishing. `npm@latest` is
      # unpinned, so the runner Node must satisfy whatever engine range the
      # current npm declares — npm 12 dropped Node 20, which broke this step.
      - run: npm install -g npm@latest

      - id: changesets
        uses: changesets/action@v2
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  attestations-core:
    # Required post-publish status for core packages. Npm publish has already
    # completed, so a failure cannot roll back packages, but it fails the
    # workflow and visibly marks the release as missing core attestations.
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - uses: sigstore/cosign-installer@v3

      - name: Install cdxgen
        run: npm install -g @cyclonedx/cdxgen@^11

      - name: Generate SBOM and cosign for core packages
        id: core-attest
        env:
          PUBLISHED: ${{ needs.release.outputs.published_packages }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORE_PACKAGES: '["@glyphp/core","@glyphp/server","@glyphp/client","@glyphp/conformance"]'
        run: |
          set -uo pipefail
          mkdir -p .attest-core
          cd .attest-core
          failed=0
          echo "$PUBLISHED" | jq -c '.[]' | while read -r row; do
            name=$(echo "$row" | jq -r .name)
            matches=$(echo "$CORE_PACKAGES" | jq -r --arg n "$name" '.[] | select(. == $n)')
            [ -z "$matches" ] && continue
            version=$(echo "$row" | jq -r .version)
            tag="${name}@${version}"

            echo "::group::$tag (core)"

            tarball=$(npm pack "$name@$version" --silent) || {
              echo "::error::npm pack failed for core package $tag"
              failed=1
              echo "::endgroup::"
              continue
            }

            extracted=$(mktemp -d)
            tar -xzf "$tarball" -C "$extracted" || {
              echo "::error::extract failed for core package $tag"
              failed=1
              echo "::endgroup::"
              continue
            }
            sbom="${tarball%.tgz}.cdx.sbom.json"
            cdxgen -t npm -o "$sbom" "$extracted/package" || {
              echo "::error::cdxgen failed for core package $tag"
              failed=1
            }

            bundle="${tarball%.tgz}.cosign.bundle"
            cosign sign-blob --yes --bundle "$bundle" "$tarball" || {
              echo "::error::cosign failed for core package $tag"
              failed=1
            }

            uploads=()
            [ -f "$sbom" ] && uploads+=("$sbom")
            [ -f "$bundle" ] && uploads+=("$bundle")
            if [ ${#uploads[@]} -gt 0 ]; then
              gh release upload "$tag" "${uploads[@]}" --clobber || {
                echo "::error::release upload failed for $tag"
                failed=1
              }
            fi
            echo "::endgroup::"
          done
          if [ "$failed" -eq 1 ]; then exit 1; fi

      - name: Retry core attestation on transient failure
        if: failure()
        env:
          PUBLISHED: ${{ needs.release.outputs.published_packages }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORE_PACKAGES: '["@glyphp/core","@glyphp/server","@glyphp/client","@glyphp/conformance"]'
        run: |
          echo "::warning::Core attestation failed; release is published but marked incomplete. Re-run the workflow after fixing the attestation outage."
          exit 1

  attestations-rest:
    # Best-effort attestation for all other (non-core) packages.
    # continue-on-error: true — never blocks the workflow.
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - uses: sigstore/cosign-installer@v3

      - name: Install cdxgen
        run: npm install -g @cyclonedx/cdxgen@^11

      - name: Generate SBOM and cosign for non-core packages
        env:
          PUBLISHED: ${{ needs.release.outputs.published_packages }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORE_PACKAGES: '["@glyphp/core","@glyphp/server","@glyphp/client","@glyphp/conformance"]'
        run: |
          set -uo pipefail
          mkdir -p .attest-rest
          cd .attest-rest
          echo "$PUBLISHED" | jq -c '.[]' | while read -r row; do
            name=$(echo "$row" | jq -r .name)
            matches=$(echo "$CORE_PACKAGES" | jq -r --arg n "$name" '.[] | select(. == $n)')
            [ -n "$matches" ] && continue
            version=$(echo "$row" | jq -r .version)
            tag="${name}@${version}"

            echo "::group::$tag"
            tarball=$(npm pack "$name@$version" --silent) || {
              echo "::warning::npm pack failed for $tag"
              echo "::endgroup::"
              continue
            }
            extracted=$(mktemp -d)
            tar -xzf "$tarball" -C "$extracted"
            sbom="${tarball%.tgz}.cdx.sbom.json"
            cdxgen -t npm -o "$sbom" "$extracted/package" \
              || echo "::warning::cdxgen failed for $tag"
            bundle="${tarball%.tgz}.cosign.bundle"
            cosign sign-blob --yes --bundle "$bundle" "$tarball" \
              || echo "::warning::cosign failed for $tag"
            uploads=()
            [ -f "$sbom" ] && uploads+=("$sbom")
            [ -f "$bundle" ] && uploads+=("$bundle")
            if [ ${#uploads[@]} -gt 0 ]; then
              gh release upload "$tag" "${uploads[@]}" --clobber \
                || echo "::warning::release upload failed for $tag"
            fi
            echo "::endgroup::"
          done
